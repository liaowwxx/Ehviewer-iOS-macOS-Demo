<!doctype html>
<html lang="zh-Hans" data-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }} · {{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}">
    <script src="{{ '/assets/js/docs.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="site-shell">
      <aside class="sidebar" id="sidebar" aria-label="文档侧边栏">
        <div class="sidebar-inner">
          <a class="brand" href="{{ '/' | relative_url }}" aria-label="EhViewer 使用说明首页">
            <span class="brand-mark" aria-hidden="true">EH</span>
            <span>
              <strong>EhViewer</strong>
              <small>使用说明</small>
            </span>
          </a>

          <div class="search-box">
            <label for="doc-search">全文搜索</label>
            <input id="doc-search" class="doc-search" type="search" placeholder="搜索文档…" autocomplete="off">
          </div>

          <div class="toc-title">目录</div>
          <nav id="sidebar-toc" class="toc" aria-label="文档目录"></nav>

          <div class="sidebar-meta">
            <span>Markdown → GitHub Pages</span>
            <a href="https://github.com/liaowwxx/Ehviewer-iOS-macOS-Demo" rel="noreferrer">查看项目源代码</a>
          </div>
        </div>
      </aside>

      <main class="main" id="main-content">
        <header class="topbar">
          <button class="menu-button" id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false">
            菜单
          </button>
          <div class="breadcrumbs" aria-label="当前位置">
            <span>EhViewer</span><span aria-hidden="true">/</span><strong>{{ page.title | default: '使用说明' }}</strong>
          </div>
          <div class="top-actions">
            <button class="theme-button" id="theme-toggle" type="button" aria-pressed="false">主题：自动</button>
            <a class="github-link" href="https://github.com/liaowwxx/Ehviewer-iOS-macOS-Demo" rel="noreferrer">GitHub</a>
          </div>
        </header>

        <section class="search-panel" id="search-panel" hidden aria-live="polite">
          <div class="search-panel-heading">
            <h2>搜索结果</h2>
            <span id="search-count"></span>
          </div>
          <div id="search-results"></div>
        </section>

        <div class="content-column">
          <article class="markdown-body" id="doc-content">
            {{ content }}
          </article>

          <nav class="page-nav" id="page-nav" aria-label="页面导航"></nav>

          <footer class="site-footer">
            <span>EhViewer 文档</span>
            <a href="https://github.com/liaowwxx/Ehviewer-iOS-macOS-Demo/issues" rel="noreferrer">反馈问题</a>
          </footer>
        </div>
      </main>
    </div>
  </body>
</html>
